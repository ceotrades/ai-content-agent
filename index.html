/7682499547981040918) |\n| LEG-56 | 2026-09-07 | free-resources | 851 | 0.67 | 4.94 | 1.65 | 0 | 44 | 64 | KEEP | EARLY (<7d) [link](https://www.tiktok.com/@ceotalks23/video/7682893822581411094) |\n| LEG-57 | 2026-09-08 | ai-video-tutorial | 1,608 | 1.26 | 1.87 | 0.31 | 0 | 55 | 54 | KILL approach (LOSE-01) | EARLY (<7d) [link](https://www.tiktok.com/@ceotalks23/video/7683221988696952086) |\n| LEG-58 | 2026-09-08 | ai-money | 466 | 0.36 | 5.36 | 0.21 | 11 | 39 | 60 | RETEST (HYP-002) | EARLY (<7d) [link](https://www.tiktok.com/@ceotalks23/video/7683270475744677142) |\n| LEG-59 | 2026-09-09 | ai-video-tutorial | 296 | 0.23 | 4.39 | 0.68 | 3 | 39 | 56 | KILL approach (LOSE-01) | EARLY (<7d) [link](https://www.tiktok.com/@ceotalks23/video/7683650778497666326) |\n| LEG-60 | 2026-09-10 | chatgpt-setup | 1,420 | 1.11 | 2.68 | 0.56 | 1 | 46 | 50 | IMPROVE | EARLY (<7d) [link](https://www.tiktok.com/@ceotalks23/video/7684018562406649110) |\n","file":"content-system/performance/performance-history.md","group":"Research","id":"performance-history","title":"Performance history (full table)","updatedAt":"2026-09-11T16:00:00Z"},"qc-test":{"body":"# QC TEST RUN (2026-09-11)\n\nPurpose: prove information flows Agent 1 > Idea > Agent 2 > Script > Post > Agent 3 > Learning > back to Agents 1 and 2, and that every ID traces.\nPart A uses **real data already in the system**. Part B is a **SIMULATED** post (made-up numbers, clearly marked) because nothing has been posted through the system yet. Nothing from Part B was written into the real learnings, performance or hypotheses files.\n\n---\n\n## Part A: the real loop, traced through the files\n\n| Step | What happened | Where it lives |\n|---|---|---|\n| 1. Performance data | 60 real posts scraped, LEG-01 to LEG-60, baseline 1,278 views | data/own-posts/2026-09-11_ceotalks23_last60.csv, performance/performance-history.md |\n| 2. Agent 1 research | 300 niche videos, 25 creator baselines, OUT-003 (@bengusberg), OUT-004 (@taki.gpt), OUT-015 (@carter.braydon) | research/current-outliers.md, research/research-log.md |\n| 3. Cross-reference | Three pairs where Dhruv covered the same content as an outlier and got under baseline: LEG-52 vs OUT-003, LEG-49 vs OUT-004, LEG-58 vs OUT-015 | research/current-outliers.md (comparison lines) |\n| 4. Agent 3 learning | LRN-005 (OBSERVATION / INTERPRETATION / HYPOTHESIS, confidence LOW) | learnings/content-learnings.md |\n| 5. Pattern + hypothesis | LOSE-03 \"leading with tool names\" (LOW) and HYP-002 with experiment EXP-002 | learnings/losing-patterns.md, learnings/hypotheses.md |\n| 6. Back into Agent 1 | IDEA-002 and IDEA-008 cite HYP-002 and LRN-005 as evidence, and are framed problem-first | ideas/idea-bank.md |\n| 7. Into Agent 2 | SCRIPT-008 applies HYP-002 (problem hook), WIN-02, avoids LOSE-03, and is marked as the problem arm of EXP-002 | scripts/script-bank.md |\n| 8. Ready for posting | Register columns capture hook type, CTA position, follow-ask time and first spoken word, so HYP-002, HYP-003, HYP-006 and LRN-011 can be tested later | scripts/published-scripts.md |\n\nResult: **PASS.** A learning created from real performance data changed what Agent 1 proposed and how Agent 2 wrote, and every link is an ID that resolves.\n\n---\n\n## Part B: SIMULATED post through Agent 3\n\n**All numbers in this section are invented for the test.**\n\n### B1. Mark as posted (Agent 2)\n`Mark SCRIPT-008 as posted: https://www.tiktok.com/@ceotalks23/video/SIMULATED 2026-09-15`\nRow it would create in published-scripts.md:\n\n| POST | Script | Idea | Date | Hook type | Format | Length | First word at | CTA | Follow ask | Series | Flags |\n|---|---|---|---|---|---|---|---|---|---|---|---|\n| POST-008 | SCRIPT-008 | IDEA-008 | 2026-09-15 | problem / before-after | screen rec + face cam | 35 s | 0.2 s | follow@end | 31 s | SETTINGS-1 | SIMULATED |\n\n### B2. Day-7 data Dhruv supplies (SIMULATED)\nviews 4,100 | likes 160 | comments 22 | shares 30 | saves 190 | avg % watched 58% | watched full 31% | new followers 38 | profile views 210\n\n### B3. Agent 3 scoring\nBaselines available: views 1,278; (likes + comments)/views 3.30%; (shares + saves)/views 2.72%. **No retention or follower baseline yet**, so Retention and Conversion are `n/a` this week and their raw values get stored to start building those baselines. This is the missing-data path working as designed.\n\n| Category | Metric | Ratio vs baseline | Points | Weight |\n|---|---|---|---|---|\n| Hook (PROXY) | 4,100 / 1,278 | 3.21x | 8 | 15 |\n| Retention | 58% avg watched | no baseline | n/a | (20) |\n| Engagement | (160 + 22) / 4,100 = 4.44% vs 3.30% | 1.35x | 7 | 10 |\n| Shareability | (30 + 190) / 4,100 = 5.37% vs 2.72% | 1.97x | 7 | 20 |\n| Conversion | 38 follows = 9.3 per 1K views | no baseline | n/a | (25) |\n| Audience relevance | manual, from comments | | 7 | 10 |\n\nOverall = (8x15 + 7x10 + 7x20 + 7x10) / (15 + 10 + 20 + 10) x 10 = 400 / 55 x 10 = **72.7 > KEEP**\nIt can't be SCALE: that needs 2+ posts on the same mechanism at 2x+ (agent-3 classification rules).\n\n### B4. What Agent 3 would write (SIMULATED, not saved to real files)\n- **LRN-SIM-01** | OBSERVATION: POST-008 (problem-framed hook, HYP-002 problem arm) reached 3.2x baseline views and 1.97x baseline (shares + saves)/views. INTERPRETATION: the before/after reply may have made the value obvious in 2 s. HYPOTHESIS: supports HYP-002, not yet comparable because no feature-arm post exists. CONFIDENCE: LOW (n=1).\n- **HYP-002 tally:** problem arm 1/2 posted, feature arm 0/2. Status stays OPEN > TESTING.\n- **idea-bank.md:** IDEA-008 status > ANALYSED. **performance-history.md:** new row POST-008, D7 numbers, score 73, KEEP, LRN-SIM-01.\n- **Weekly TEST list:** \"Post the two feature-framed arms of EXP-002 before any more problem-framed list posts, so the comparison stays clean.\"\n\n### B5. Back into Agents 1 and 2 next Monday\n- Agent 1 reads HYP-002 = TESTING and ranks one feature-framed list idea into the top 5 to complete the experiment (instead of adding more problem-framed ones).\n- Agent 2 reads the experiment note and writes that script with a feature-name hook on purpose, recording `Test variable: HYP-002 feature arm`.\n\nResult: **PASS.** The simulated post links POST-008 > SCRIPT-008 > IDEA-008 > HYP-002 > LRN, and the learning changes next week's research and scripting.\n\n---\n\n## Part C: automated integrity check\n\n`python3 system-test/check_links.py` (run 2026-09-11):\n- Defined IDs: OUT-001 to OUT-017, CP-01 to CP-08, IDEA-001 to IDEA-018, LRN-001 to LRN-012, WIN-01 to WIN-04, LOSE-01 to LOSE-04, HYP-001 to HYP-006, EXP-001 to EXP-005, SCRIPT-006, SCRIPT-008\n- Every OUT, CP, LRN, WIN, LOSE, HYP, EXP and SCRIPT reference in the system resolves to a definition: **0 broken references**\n- Every file path referenced in the agent files exists: **pass**\n- LEG references all within LEG-01 to LEG-60: **pass**\n- Em dashes outside raw data: **0** (raw scrapes keep creators' original captions)\n\n## Checklist from the brief\n\n| Check | Result |\n|---|---|\n| Agents know where to find information (each agent has a mandatory read list with paths) | PASS |\n| Files use consistent formats (every block comes from /templates) | PASS |\n| Learnings are fed back (Part A steps 4 to 7) | PASS |\n| Ideas have IDs | PASS (IDEA-001 to 018) |\n| Scripts link to idea IDs | PASS (SCRIPT-006 > IDEA-006, SCRIPT-008 > IDEA-008) |\n| Published posts link to script IDs | PASS (register design, Part B1) |\n| Performance data links to post IDs | PASS (performance-history columns, Part B4) |\n| Learnings reference the posts that created them | PASS (every LRN cites LEG or POST IDs) |\n\n## Problems found and fixed during QC\n1. README's example chain used IDs that don't exist yet (LRN-013, WIN-05). Now labelled as a future example.\n2. Agent 2's speaking-pace estimate was 2.7 words/s. Measured from LEG-34 and LEG-60 subtitles, Dhruv's edited pace is 4.4 to 4.6 words/s. Changed to 4.\n3. One alternative hook in SCRIPT-008 used a \"not because\" contrast (stop-slop violation). Replaced.\n4. IDEA-006 and IDEA-008 still showed READY after scripts were drafted. Set to SCRIPTED.\n5. WIN-02 said \"six Claude lists in August\"; the data shows five. Corrected.\n\n## Known limitations\n- Retention, follows per view and demographics are placeholders until TikTok Studio data arrives. Until then, scores run on public metrics only (Hook as a proxy, Engagement, Shareability).\n- Several niche baselines are THIN-BASE (very frequent posters). Outlier scores above ~100 are directional.\n- Legacy views were captured at different post ages; D7 grading only starts with system posts.\n- The goal maths uses a rough 0.36% follows-per-view figure. Real per-post follower data will replace it.\n","file":"content-system/system-test/QC_TEST_RUN.md","group":"Test","id":"qc-test","title":"QC test run","updatedAt":"2026-09-11T16:00:00Z"},"readme":{"body":"# @ceotalks23 CONTENT SYSTEM\n\nThree agents that share one folder of Markdown files:\n\n1. **Agent 1, Research** finds TikTok posts that beat their creator's normal views by 5x or more, works out why, and turns the mechanism into original ideas.\n2. **Agent 2, Script** turns the ideas you approve into shoot-ready scripts, using what's worked and failed on your account.\n3. **Agent 3, Performance** grades your posts every week, and is the only agent that writes to `/learnings/`. The other two read those learnings before they do anything.\n\nGoal: 1,964 followers (11 Sep 2026) to **20,000 by 31 Dec 2026**, then a paid community for no-code AI builders. Read `CONTENT_SYSTEM_CONTEXT.md` first.\n\n## It runs itself now\n- **Dashboard:** https://claude.ai/code/artifact/b2daa595-7e01-4415-8e67-7aa7310e2603 (live agent monitors, ideas, scripts, research, performance, learnings, library, inbox). The dashboard's database is the source of truth.\n- **Weekly run, Monday 07:00 UK:** Agent 3, then Agent 1, then Agent 2 drafts the top 3 ideas. Push notification when done.\n- **Nightly sync, 22:30 UK:** handles what you approved or rejected in the dashboard, pulls new posts and your follower count, scripts approved ideas.\n- **Folder mirror, 23:30 UK:** copies the database into this folder. Needs your PC on; skips if not. **Edit in the dashboard, not here:** the mirror overwrites these files.\n- How the runs work: `AUTOMATION.md`.\n\nYour part each week: approve or reject ideas, approve scripts, shoot, mark posts as posted, and log TikTok Studio numbers on day 7 (the dashboard can read a screenshot for you).\n\n## Running an agent by hand (optional)\nOpen a Cowork session and paste one line. With the dashboard as the source of truth, add: \"Use the dashboard database as described in content-system/AUTOMATION.md.\" \n\n| Agent | Command |\n|---|---|\n| Agent 1 | `Read content-system/agents/agent-1-research.md, then run weekly content research and generate 10 to 20 original ideas.` |\n| Agent 2 | `Read content-system/agents/agent-2-script.md, then turn these ideas into scripts: IDEA-###, IDEA-###.` |\n| Agent 3 | `Read content-system/agents/agent-3-performance.md, then analyse this week's content performance.` (attach TikTok Studio screenshots or the CSV) |\n\nEach agent file lists more commands (launch watch, hook lab, grade one post, monthly review). Inside the agent files, a path starting with `/` means the `content-system/` folder.\n\n## Weekly\nMonday: Agent 3, then Agent 1, then you pick ideas, then Agent 2. Tuesday: shoot. Wednesday to Sunday: post daily and log each post. Full steps in `WEEKLY_WORKFLOW.md`.\n\n## Daily\n`Mark SCRIPT-### as posted: [URL] [date]` after every post. Use Agent 2 for any extra scripts.\n\n## Monthly\n`Run the monthly review.` (Agent 3): winning and losing topics, hooks, formats, audience behaviour, experiments, change over time.\n\n## Folder map\n```\ncontent-system/\n  CONTENT_SYSTEM_CONTEXT.md   who you are, goal, audience, voice, LOCKED brand rules\n  README.md                   this file\n  WEEKLY_WORKFLOW.md          the repeatable week\n  agents/                     the three agents' instructions\n  research/                   outliers, patterns, creator baselines, run log  (Agent 1)\n  ideas/                      idea bank, approved, rejected                    (Agent 1 + you)\n  scripts/                    script bank + the POST register                  (Agent 2)\n  performance/                weekly reports + post history and baseline       (Agent 3)\n  learnings/                  learnings, winning/losing patterns, audience, hypotheses (Agent 3 only)\n  templates/                  blank formats every agent uses\n  data/                       raw scrapes (own posts, niche searches, baselines)\n  system-test/                the build-time test run of the full loop\n```\n\n## IDs (how everything traces back)\nExample chain (POST-006 onward doesn't exist yet; it appears once you post SCRIPT-006):\n```\nRUN-2026-W37 (research run)\n  OUT-004 (outlier) > CP-05 (niche pattern)\n    IDEA-006 > SCRIPT-006 > POST-006 > WK-2026-W38 grade > LRN-013 > WIN-05\n```\n| Prefix | Meaning | Where |\n|---|---|---|\n| RUN-YYYY-Www | research run | research/research-log.md |\n| OUT-### | niche outlier | research/current-outliers.md |\n| CP-## | niche content pattern | research/content-patterns.md |\n| IDEA-### | idea (never reused) | ideas/ |\n| SCRIPT-### | script, same number as its idea (variants: 006b) | scripts/script-bank.md |\n| POST-### | posted script, same number | scripts/published-scripts.md |\n| EXT-### | post made outside the system | scripts/published-scripts.md |\n| LEG-## | the 60 posts before the system | performance/performance-history.md |\n| WK-YYYY-Www | weekly report | performance/weekly-performance.md |\n| LRN-### | learning | learnings/content-learnings.md |\n| WIN-## / LOSE-## | proven pattern on your account | learnings/ |\n| HYP-### / EXP-### | hypothesis and its experiment | learnings/hypotheses.md |\n\n## Rules every agent follows\n- Numbers are `[VERIFIED]`, `[ESTIMATE]` with the maths shown, or left out. Guesses are labelled `[INTERPRETATION]`.\n- Mechanisms, never copies. Every idea passes a 4-part originality test.\n- Brand rules in CONTENT_SYSTEM_CONTEXT section 14 are locked. Performance data can change hooks, topics, formats and CTAs, never the brand.\n- One post never makes a pattern. Small samples get LOW confidence and no causal language.\n- Winners are always compared with losers.\n\n## Running costs\nAgent 1 uses the Apify connector (`clockworks/tiktok-scraper`): about $2 to $4 per weekly run at current free-tier prices. The seed run on 11 Sep 2026 cost about $3.61.\n","file":"content-system/README.md","group":"System","id":"readme","title":"README","updatedAt":"2026-09-11T16:00:00Z"},"research-log":{"body":"# RESEARCH LOG\n\nOwner: Agent 1. One entry per run, newest on top. Keeps a record of what was searched, what it cost and what changed, so later runs don't repeat work.\n\n---\n\n## RUN-2026-W37 | 2026-09-11 | Seed run (built with the system)\n\n**Queries (search, past month, 30 each):** claude code, claude cowork, ai agent tutorial, vibe coding app, build app with ai no code, n8n automation, ai tools you need, chatgpt tips, ai website builder, make money with ai\n**Baselines pulled:** 25 creators x 20 latest non-pinned posts (498 posts): yatesvids, deebuildsai, textura.us, bymarcoperez, cody.saunders.ai, millee.md, lucca.the.develop, webforge6, johnsavage.ai, shigcodes, verysuccessfulcompany, malikontech, bengusberg, carter.braydon, taki.gpt, ai.honeycove, itsmariahbrunner, willfrancis24, usefulaiwebsites, androoagi, techwlynn, techwithdonna, xo.cierranicole, dawoodzahidd, marcinteodoru\n**Subtitles pulled:** 14 niche outliers + 11 of Dhruv's own posts\n**Also pulled:** @ceotalks23 last 60 posts (feeds Agent 3's baseline)\n\n**Counts:** 300 search results, 249 unique creators, 70 raw outliers (OS >= 5, >= 20K views), 17 analysed, 4 excluded (BOOST?, OFF-NICHE, SPON)\n**Spend [ESTIMATE]:** own profile 60 x $0.0037 = $0.22 | search 300 x ($0.0037 + $0.0013 date filter) = $1.50 | baselines 498 x $0.0037 = $1.84 | detail pages 14 x $0.0037 = $0.05 | run-start fees ~$0.004 | **total ~$3.61**\n\n**Top findings**\n1. Three creators independently hit big with \"your AI-built site is unsafe / looks AI-made\" checklists (CP-01, 10 outliers). This is the strongest pattern in the run and sits right on Dhruv's community topic.\n2. GPT-6 Astra launch reactions and utility posts broke out for four creators within days (CP-04). Dhruv's Astra post came ~6 days late with a generic angle.\n3. Three direct \"same content, different packaging\" pairs against Dhruv's own posts: LEG-52 vs @bengusberg, LEG-49 vs @taki.gpt, LEG-58 vs @carter.braydon. In each, Dhruv led with the tool or item names; the outlier led with a problem, an outcome or an identity. Created HYP-002.\n4. @taki.gpt runs the exact business model Dhruv wants (content > \"comment community\" > paid AI community) and posts hit 8x to 214x his baseline.\n\n**Queries to try next run:** claude skills, google flow veo, ai app builder, ai second brain, claude code for beginners, ai for students, ai jobs 2026, plus any launch in the prior 7 days\n**Gaps:** no comment analysis yet (comments not scraped). No Instagram/YouTube Shorts research. Baselines for johnsavage.ai, cody.saunders.ai and usefulaiwebsites are THIN-BASE.\n","file":"content-system/research/research-log.md","group":"Research","id":"research-log","title":"Research log","updatedAt":"2026-09-11T16:00:00Z"},"tpl-content-idea":{"body":"# TEMPLATE: Content idea (Agent 1)\nCopy into `/ideas/idea-bank.md`. IDs are sequential and never reused.\n\n```\n### IDEA-### | Title\n- ID: IDEA-### | Date discovered: YYYY-MM-DD | Status: NEW / RESEARCHED / READY / SCRIPTED / PUBLISHED / ANALYSED / RETEST / ARCHIVED\n- Source: (CP-## / OUT-### / LRN-### / Dhruv / comment)\n- Source URL:\n- Topic: | Pillar: P1-P5\n- Core concept:\n- Target audience:\n- Hook:\n- Why this could work:\n- Research evidence:\n- Psychological mechanism:\n- Format: | Length:\n- Key talking points:\n- Potential CTA:\n- Originality angle: (passes the 4-part originality test in agent-1-research.md step 5)\n- Do NOT copy:\n- Scores: Evidence _ | Hook _ | Relevance _ | Novelty _ | Emotion _ | Share _ | Retention _ | Ease _ | Brand _\n- Opportunity score: (sum of score x weight / 10) | Outlier score of source: | Confidence: | Priority:\n- Related winning pattern: WIN-## | Related hypothesis: HYP-###\n- Notes:\n```\n\nWeights: Evidence 15, Hook 15, Audience relevance 15, Novelty 10, Emotion 10, Shareability 10, Retention 10, Ease 5, Brand fit 10.\nExample: scores 7,8,8,7,7,8,7,10,10 give (105+120+120+70+70+80+70+50+100)/10 = 78.5.\n","file":"content-system/templates/content-idea.md","group":"Templates","id":"tpl-content-idea","title":"Template: content idea","updatedAt":"2026-09-11T16:00:00Z"},"tpl-monthly-review":{"body":"# TEMPLATE: Monthly review (Agent 3, with Agent 1 input)\nRun with: `Run the monthly review.` Save as a new section at the top of `/performance/weekly-performance.md` headed `MONTH-YYYY-MM`.\n\n```\n## MONTH-YYYY-MM | review date\n\n### Goal check\n- Followers start / end / change:\n- Needed pace vs actual pace (show the maths):\n- Projection to 31 Dec at the current pace:\n\n### Topics\n- Winning topics (pillar, posts, median x baseline):\n- Losing topics:\n\n### Hooks\n- Hook types ranked by median x baseline and by (shares+saves)/views, with post counts:\n\n### Formats and length\n- Format ranking:\n- Length bands:\n\n### Audience behaviour\n- Demographic shifts:\n- Comment themes and requests:\n- Follows per 1K views trend:\n\n### Experiments\n| EXP | HYP | Posts | Result | Status change |\n|---|---|---|---|---|\n\n### What changed over the month\n- Patterns promoted / downgraded / retired:\n- Niche patterns that faded or appeared (from research-log.md):\n\n### Drift check\n- Did any change touch the locked brand block? (should be no)\n- Brand flags raised this month:\n\n### Next month\n- 3 priorities:\n- Pillar mix (posts per week per pillar):\n- Experiments to run:\n- CONTEXT file edits proposed for Dhruv:\n```\n","file":"content-system/templates/monthly-review.md","group":"Templates","id":"tpl-monthly-review","title":"Template: monthly review","updatedAt":"2026-09-11T16:00:00Z"},"tpl-research-report":{"body":"# TEMPLATE: Research run report (Agent 1)\nCopy into `/research/research-log.md` (summary) and use the blocks below in the other research files.\n\n## RUN-YYYY-Www | YYYY-MM-DD | [Full run / Quick scan / Launch watch / Trend check]\n\n**Read first:** CONTEXT updated [date] | Learnings read: LRN-### to LRN-### | Open hypotheses needing research: HYP-###\n**Queries:** (list, mark new ones with *)\n**Baselines:** pulled [n] creators / re-used [n] from [file date]\n**Subtitles pulled:** [n]\n**Counts:** [n] results | [n] unique creators | [n] raw outliers (OS >= 5, >= 20K) | [n] analysed | [n] excluded (reason)\n**Spend:** [results x price] = $[x] (show the maths)\n\n### Top findings (max 5)\n1.\n2.\n\n### Patterns changed\n| CP | Change | Evidence |\n|---|---|---|\n| CP-## | new / strengthened / weakened / FADING | OUT-### |\n\n### Ideas added\nIDEA-### to IDEA-### (top 5 with scores and the \"why this week\" paragraph go in idea-bank.md)\n\n### Contradictions with current learnings\n(anything in the niche data that conflicts with a WIN/LOSE pattern, for Agent 3 to weigh)\n\n### Next run\nQueries to try:\nGaps:\n\n---\n\n## Outlier block (for current-outliers.md)\n```\n### OUT-### | @creator | OS xx.x (label) | flags\n- URL:\n- Posted: | Found in: RUN- | Query:\n- [VERIFIED] Views / likes / comments / shares / saves:\n- [VERIFIED] Followers: | Creator baseline (median last 20):\n- [VERIFIED] Length: | Save rate: | Share rate:\n- Hook (first 1-3 s):\n- Topic: | Angle: | Format: | Structure:\n- Emotional trigger: | Curiosity mechanism:\n- CTA:\n- [INTERPRETATION] Why it likely worked:\n- Transferable mechanism:\n- Do NOT copy:\n- Pattern: CP-##\n```\n\n## Pattern block (for content-patterns.md)\n```\n### CP-## | Name | STRENGTH\n- Evidence: OUT-### (views, OS), ...\n- Hook pattern:\n- Topic:\n- Format:\n- Psychology:\n- Transfer to @ceotalks23:\n- Watch out:\n- Last seen:\n```\n","file":"content-system/templates/research-report.md","group":"Templates","id":"tpl-research-report","title":"Template: research report","updatedAt":"2026-09-11T16:00:00Z"},"tpl-script":{"body":"# TEMPLATE: Script package (Agent 2)\nCopy into `/scripts/script-bank.md`.\n\n```\n## SCRIPT-### | from IDEA-### | status: DRAFT\nVariant of: (blank or SCRIPT-###) | Test variable: (blank or HYP-### + what changes)\n\n### CONTENT STRATEGY\n- Concept:\n- Target viewer:\n- Primary emotion:\n- Hook mechanism:\n- Retention mechanism:\n- Payoff:\n- CTA:\n- Expected viewer action:\n- Patterns applied: WIN-## | Avoided: LOSE-##\n- Estimated length: [words] / 4 = [x] s\n\n### PRE-SHOOT TEST (only if the video depends on a live result)\n\n### SCRIPT\n[0-2 s] HOOK (spoken):\n[0-2 s] ON-SCREEN TEXT:\n[2-x s]\n[x-y s]\n[end] CTA:\n\n### VISUAL DIRECTION\n| Time | On screen | Framing | B-roll / screen rec | Text overlay | Edit note |\n|---|---|---|---|---|---|\n\n### ALTERNATIVE HOOKS\n1.\n2.\n3.\n\n### CAPTION\n(first line restates the hook; 1-3 short lines; max 5 hashtags; stop-slop rules)\n\n### CTA\n\n### PRE-SHOOT CHECKS\n- [ ] All [CHECK] tags cleared against the live product\n- [ ] Keyword resource exists and is ready to send (if used)\n- [ ] Nothing confidential or client-identifying on screen\n- [ ] No locked-brand conflicts (CONTEXT section 14)\n```\n\nHook scoring (internal, at least 8 candidates, 1-5 each): curiosity, specificity, emotional tension, relevance, novelty, believability, instant clarity. Keep the top scorer; the next 3 become the alternative hooks.\n","file":"content-system/templates/script-template.md","group":"Templates","id":"tpl-script","title":"Template: script","updatedAt":"2026-09-11T16:00:00Z"},"tpl-weekly-report":{"body":"# TEMPLATE: Weekly performance report (Agent 3)\nCopy to the top of `/performance/weekly-performance.md`.\n\n```\n## WK-YYYY-Www | YYYY-MM-DD\n\n**Posts analysed:** POST-### ... (D7 graded) | EARLY (provisional): POST-### ...\n**Data available:** (list) | **Missing:** (list, and which score categories were dropped)\n\n### Headline numbers\n- Followers: [n] (change [+n], needed pace [+n/week], on track: yes/no)\n- Baseline median views: [n] (recomputed? y/n)\n- Week median views: [n] ([x] baseline)\n\n### Post grades\n| POST | Idea | Views D7 | x base | Hook | Retention | Engagement | Share | Conversion | Relevance | Overall | Class |\n|---|---|---|---|---|---|---|---|---|---|---|---|\n\nFor each post:\n#### POST-### | [title] | [class]\n1. What happened:\n2. How good was it (vs baseline, recent, same pillar):\n3. Why (OBSERVATION / INTERPRETATION):\n4. Learning: LRN-###\n5. Do differently:\nScore explanation (2-3 lines):\n\n### Winners vs losers\n- What the top posts did that the bottom posts didn't:\n- What the bottom posts did that we should stop:\n\n### Cross-post patterns\n| Dimension | Observation (post IDs) | Interpretation | Hypothesis | Confidence |\n|---|---|---|---|---|\n| Topic | | | | |\n| Hook | | | | |\n| Format | | | | |\n| Length | | | | |\n| Delivery | | | | |\n| Emotion | | | | |\n| CTA | | | | |\n| Audience | | | | |\n| Timing | | | | |\n\n### Knowledge base changes\n- New learnings: LRN-###\n- Patterns: WIN-## (strengthened/weakened/new/retired), LOSE-## (...)\n- Hypotheses: HYP-### tally x/y, status\n- Ideas moved to ANALYSED / RETEST: IDEA-###\n\n### Brand flags\n(any data pushing against the locked block; no action taken)\n\n### CONTINUE (1-3)\n### STOP (1-3)\n### TEST (1-3, each: HYP, variable, control, n posts, win condition)\n\n### Data request for next week\n```\n","file":"content-system/templates/weekly-performance-report.md","group":"Templates","id":"tpl-weekly-report","title":"Template: weekly report","updatedAt":"2026-09-11T16:00:00Z"},"workflow":{"body":"# WEEKLY WORKFLOW (autonomous version)\n\nThe agents run on a schedule. Your job is the decisions and the camera. Everything happens in the dashboard:\nhttps://claude.ai/code/artifact/b2daa595-7e01-4415-8e67-7aa7310e2603\n\n## What runs by itself\n\n| When (UK) | Task | What you'll see in the dashboard |\n|---|---|---|\n| Monday 07:00 | Weekly run | Agent 3 monitor goes LIVE (grading last week), then Agent 1 (research), then Agent 2 (top 3 scripts). New report on Overview. Push notification when finished. |\n| Every day 22:30 | Nightly sync | Your approvals and rejections get processed, new posts and follower count arrive, approved ideas get scripted. |\n| Every day 23:30 | Folder mirror | Claude Brain/content-system gets a fresh copy (only if your PC is on). |\n\n## Your week (about 45 minutes plus shooting)\n\n**Monday morning (20 min)**\n1. Open the dashboard. Overview > \"Needs you\".\n2. Read the new weekly report (Continue / Stop / Test).\n3. Ideas: approve 5 to 7, reject the rest with a one-line reason (the agents learn from the reasons).\n4. Scripts: read the 3 drafts Agent 2 wrote. Approve, or hit \"Script now\" on anything you approved that you want today. Use \"Hook lab\" if a hook feels weak.\n\n**Monday night:** the nightly sync scripts everything else you approved.\n\n**Tuesday:** batch-shoot. Clear every [CHECK] tag against the live product first.\n\n**Every posting day (2 min)**\n- Scripts > \"Mark as posted\": paste the TikTok link. This creates the POST record.\n\n**Day 7 after each post (2 min)**\n- Performance > \"Log day-7 numbers\": upload the TikTok Studio screenshot and Claude fills the fields, or type them in. Without this, grades use public numbers only and can't see retention or new followers.\n\n**Any time**\n- Inbox > \"Tell the agents\": corrections, topics you want, things to stop. Read by the next sync.\n- A big AI launch happens: send a note in the Inbox (\"Launch: [product]\"), or open a Cowork chat and run `Launch watch` from agents/agent-1-research.md for same-day speed.\n\n## First Monday of each month\nTell the weekly run to include the monthly review: Inbox > \"Run the monthly review this Monday.\" It uses templates/monthly-review.md.\n\n## If something looks wrong\n- A monitor says \"stalled?\": the run stopped updating for 45+ minutes. Check the run's session in your scheduled tasks list.\n- A monitor shows \"error\": its step says what failed. Most common: the Apify connector needs re-authorising.\n- Numbers look off: every number in the system traces to a post ID or a run. Open the run in Agents > Run history.\n","file":"content-system/WEEKLY_WORKFLOW.md","group":"System","id":"workflow","title":"Weekly workflow","updatedAt":"2026-09-11T16:00:00Z"}},"hypotheses":{"HYP-001":{"body":"### HYP-001 | Trend freshness beats template\n- **Hypothesis:** An AI-creation tutorial on a trend under 14 days old will beat baseline by 3x+; the same template on a trend older than 30 days will land under 1.5x.\n- **Source:** LRN-002, LRN-007, LOSE-01\n- **EXP-001 test:** Next 3 TREND SLOT posts, each on a trend Agent 1 has dated as under 14 days old (first breakout date recorded in the idea). Same template as LEG-17 (result first, free tools, steps).\n- **Win condition:** 2 of 3 posts reach >= 3x baseline on D7 views.\n- **Result:** pending\n- **Tell future agents:** until tested, treat trend age as a hard filter for the TREND SLOT.","experiment":"EXP-001","id":"HYP-001","status":"OPEN","tally":"0/3","title":"Trend freshness drives AI-creation tutorial wins more than the script template"},"HYP-002":{"body":"### HYP-002 | Problem/outcome framing beats feature naming\n- **Hypothesis:** For list content about tools or skills, a hook that opens on the viewer's problem or the visible outcome will get higher (shares + saves) per view and more views than a hook that opens on the tool names.\n- **Source:** LRN-005, LOSE-03, CP-01, CP-08\n- **EXP-002 test:** Next 4 list posts in pillar P2 or P4. 2 use problem/outcome hooks, 2 use feature hooks. Keep length within 30 to 45 s and post at the usual evening time.\n- **Win condition:** Problem-framed pair averages >= 1.5x the feature-framed pair on (shares + saves) / views and on D7 views.\n- **Result:** pending","experiment":"EXP-002","id":"HYP-002","status":"OPEN","tally":"0/4","title":"Problem/outcome framing beats feature naming for the same content"},"HYP-003":{"body":"### HYP-003 | Result-first opening is necessary but not sufficient\n- **Hypothesis:** Visual tutorials that open on the result hold viewers better at 3 s than ones that open on Dhruv talking, but won't break out without a fresh subject.\n- **Source:** LRN-007\n- **Test:** Needs 3-second retention data from TikTok Studio. Record \"first spoken word at x s\" in published-scripts.md for every post, so the comparison builds up over time.\n- **Result:** pending","experiment":"folded into EXP-001","id":"HYP-003","status":"OPEN","tally":"","title":"Result-first opening helps visual tutorials but isn't enough alone"},"HYP-004":{"body":"### HYP-004 | A named series raises follows per view\n- **Hypothesis:** Posts in a named recurring series (same title card, \"Part N\", one promise) will get more new followers per 1K views than one-off posts of similar views.\n- **Source:** Goal maths in CONTENT_SYSTEM_CONTEXT section 1 (follows per view must rise); @millee.md and @yatesvids repeat one format with changing content.\n- **EXP-003 test:** 6 posts in one series (candidate: IDEA-006 \"AI agents run my TikTok\" or IDEA-001 \"Launch checklist\") over 2 weeks, compared with the 6 nearest-in-time one-off posts.\n- **Win condition:** Series median new followers per 1K views >= 1.5x the one-offs. Needs TikTok Studio follower data per post.\n- **Result:** pending","experiment":"EXP-003","id":"HYP-004","status":"OPEN","tally":"0/6","title":"A named recurring series raises follows per 1K views"},"HYP-005":{"body":"### HYP-005 | Launch speed\n- **Hypothesis:** A utility post (\"what this launch changes for you\") within 48 h of a major AI launch will beat baseline by 3x+; the same topic 5+ days later lands near baseline.\n- **Source:** CP-04; LEG-60 (Astra, ~6 days late, 1.11x)\n- **EXP-004 test:** Next 2 major launches (Claude, ChatGPT, Gemini or Google Flow/Veo). Agent 1 `Launch watch` + Agent 2 `Launch script`, posted within 48 h.\n- **Win condition:** Both >= 3x baseline.\n- **Result:** pending","experiment":"EXP-004 (runs on the next launch)","id":"HYP-005","status":"OPEN","tally":"0/2","title":"Posting within 48 h of a major launch beats posting 5+ days after"},"HYP-006":{"body":"### HYP-006 | CTA placement\n- **Hypothesis:** A comment-keyword CTA in the middle of a video (as in LEG-49 at ~30 s) lowers average % watched compared with the same CTA at the end.\n- **Source:** LEG-49 vs OUT-004 comparison; LRN-010\n- **EXP-005 test:** 4 posts with a keyword CTA: 2 mid-video, 2 at the end, similar topic and length.\n- **Win condition:** End-CTA pair shows >= 10% higher average % watched. Needs TikTok Studio retention data.\n- **Result:** pending","experiment":"EXP-005","id":"HYP-006","status":"OPEN","tally":"0/4","title":"A mid-video comment-keyword CTA hurts retention vs an end CTA"}},"ideas":{"IDEA-001":{"body":"### IDEA-001 | The check I run before anything AI-built goes live\n- ID: IDEA-001 | Date discovered: 2026-09-11 | Status: READY\n- Source: CP-01 (OUT-001 @yatesvids, OUT-002 @millee.md, OUT-003 @bengusberg)\n- Source URLs: https://www.tiktok.com/@yatesvids/video/7682213197570460946 | https://www.tiktok.com/@millee.md/video/7673301891551448341\n- Topic: pre-launch checklist for AI-built sites and apps | Pillar: P4\n- Core concept: Dhruv's own pre-launch checklist from sites he has actually shipped with Claude, turned into one paste-ready prompt, shown running on a real site and catching real problems.\n- Target audience: non-coders who've built (or are about to build) a site with AI\n- Hook: \"Your AI-built site has problems you can't see on your own screen. I paste this before anything I build goes live.\"\n- Why this could work: same fear-plus-fix mechanism as 10 outliers; the prompt is saveable; Dhruv has real experience to draw on.\n- Research evidence: CP-01 STRONG, save rates 5.7% to 8.7%\n- Psychological mechanism: loss aversion, self-assessment\n- Format: screen recording: prompt pasted into Claude > Claude's audit results on a real site > one fix shown | Length: 35 to 45 s\n- Key talking points: items Dhruv has actually been caught by (mobile layout, broken form, missing favicon/title, page speed, no privacy page, placeholder text left in). [PLACEHOLDER: Dhruv confirms his real list]\n- Potential CTA: comment \"CHECK\" for the full prompt (needs the prompt ready to send)\n- Originality angle: his list, his real sites, the audit shown running. Different fear (\"problems you can't see\") from the source hooks (sued, hacked, looks vibe coded).\n- Do NOT copy: \"Hey Claude, I do not want my...\" or \"make no mistakes\"\n- Scores: Evidence 9 | Hook 7 | Relevance 9 | Novelty 6 | Emotion 8 | Share 9 | Retention 7 | Ease 9 | Brand 9\n- Opportunity score: 81.0 | Source OS: 50.2 / 21.5 / 21.0 | Confidence: HIGH (niche), untested on account | Priority: 2\n- Related winning pattern: none on account yet | Related hypothesis: HYP-004 (could become a series: \"Launch check #1, #2...\")","concept":"Dhruv's own pre-launch checklist from sites he has actually shipped with Claude, turned into one paste-ready prompt, shown running on a real site and catching real problems.","confidence":"HIGH","dateFound":"2026-09-11","format":"screen recording: prompt pasted into Claude > Claude's audit results on a real site > one fix shown | Length: 35 to 45 s","hook":"Your AI-built site has problems you can't see on your own screen. I paste this before anything I build goes live.","id":"IDEA-001","pillar":"P4","rank":2,"runId":"RUN-2026-W37","score":81,"status":"READY","title":"The check I run before anything AI-built goes live","whyNow":"Strongest niche pattern (CP-01, 10 outliers)"},"IDEA-002":{"body":"### IDEA-002 | Same prompt, two websites\n- ID: IDEA-002 | Date discovered: 2026-09-11 | Status: READY\n- Source: CP-01 (@bengusberg status threat), CP-02 (visual), LRN-005 (LEG-52 packaging failure)\n- Source URL: https://www.tiktok.com/@bengusberg/video/7678155840456592671\n- Topic: making AI-built sites not look AI-built | Pillar: P4\n- Core concept: Split screen. Left: the site Claude builds from a plain prompt. Right: the same prompt after installing 2 to 3 design skills. Then name the skills.\n- Target audience: non-coders building sites with Claude\n- Hook: \"Same prompt. Same Claude. One of these took 3 extra minutes of setup.\" (on screen: LEFT vs RIGHT)\n- Why this could work: the difference is visible in 1 second; it re-packages LEG-52's content around the outcome (HYP-002).\n- Research evidence: CP-01, CP-02; LEG-52 at 0.58x with feature framing\n- Psychological mechanism: contrast effect, curiosity (what changed?), status\n- Format: split-screen screen recording | Length: 30 to 40 s\n- Key talking points: default look (generic font, beige, centred hero); the 2 to 3 skills and what each changed; where to get them\n- Potential CTA: comment \"SKILLS\" for links, or follow\n- Originality angle: a controlled side-by-side test on Dhruv's own build. The source used a talking list.\n- Scores: Evidence 8 | Hook 8 | Relevance 9 | Novelty 8 | Emotion 7 | Share 7 | Retention 8 | Ease 7 | Brand 10\n- Opportunity score: 81.0 | Source OS: 21.0 | Confidence: MEDIUM | Priority: 3\n- Related winning pattern: WIN-02 (list) | Related hypothesis: HYP-002 (problem/outcome arm of EXP-002)","concept":"Split screen. Left: the site Claude builds from a plain prompt. Right: the same prompt after installing 2 to 3 design skills. Then name the skills.","confidence":"MEDIUM","dateFound":"2026-09-11","format":"split-screen screen recording | Length: 30 to 40 s","hook":"Same prompt. Same Claude. One of these took 3 extra minutes of setup.\" (on screen: LEFT vs RIGHT)","id":"IDEA-002","pillar":"P4","rank":3,"runId":"RUN-2026-W37","score":81,"status":"READY","title":"Same prompt, two websites","whyNow":"Tests HYP-002 on content Dhruv already covered badly (LEG-52)"},"IDEA-003":{"body":"### IDEA-003 | GPT-6 Astra vs Claude, same no-code build\n- ID: IDEA-003 | Date discovered: 2026-09-11 | Status: READY (post by 2026-09-15 or ARCHIVE)\n- Source: CP-04 (OUT-008 to OUT-011)\n- Topic: head-to-head test on one no-code task | Pillar: P5\n- Core concept: Give both the same prompt (\"build me a booking page for a barber\") and show both results side by side.\n- Hook: \"Same prompt into GPT-6 Astra and Claude. One of them built something I'd actually use.\"\n- Research evidence: 4 creators broke out on Astra between 2026-09-04 and 09-10; LEG-60 (late, generic) got 1.11x\n- Psychological mechanism: contest curiosity, FOMO\n- Format: split screen | Length: 30 to 45 s\n- Potential CTA: \"which one would you pick?\" (comment question)\n- Originality angle: a real build comparison for non-coders; the sources are reactions and usage tips\n- Scores: Evidence 6 | Hook 7 | Relevance 8 | Novelty 6 | Emotion 6 | Share 6 | Retention 8 | Ease 6 | Brand 9\n- Opportunity score: 69.5 | Confidence: LOW (window closing) | Priority: 10 | Related hypothesis: HYP-005 (late-arm data point)","concept":"Give both the same prompt (\"build me a booking page for a barber\") and show both results side by side.","confidence":"LOW","dateFound":"2026-09-11","expires":"2026-09-15","format":"split screen | Length: 30 to 45 s","hook":"Same prompt into GPT-6 Astra and Claude. One of them built something I'd actually use.","id":"IDEA-003","pillar":"P5","rank":10,"runId":"RUN-2026-W37","score":69.5,"status":"READY","title":"GPT-6 Astra vs Claude, same no-code build","whyNow":"Launch window closing; po s, saves, length, captions, subtitles for 11 posts. **Missing:** retention, new followers per post, profile views, traffic sources, demographics (TikTok Studio only).\n\n### Headline numbers\n- Followers: 1,964. Goal pace: +1,137/week.\n- Baseline median views: 1,278 (51 matured non-pinned posts).\n- Biggest post in the window: LEG-17, 317,300 views (248x), pinned.\n- September posts: median 925, but all under 11 days old, so no trend call (LRN-006).\n\n### Top 5 (x baseline)\n| Post | Views | x | What it was |\n|---|---|---|---|\n| LEG-17 | 317,300 | 248 | AI fruit video tutorial, result-first |\n| LEG-25 | 55,400 | 43 | AI brainrot tutorial, result-first |\n| LEG-13 | 28,100 | 22 | AI UGC tutorial, comment \"UGC\" |\n| LEG-34 | 24,000 | 18.8 | \"Five things to do when you start using Claude\" |\n| LEG-32 | 16,400 | 12.8 | \"4 AI certifications that get you hired\" |\n\n### Bottom 5\n| Post | Views | x | What it was |\n|---|---|---|---|\n| LEG-59 | 296 | 0.23 | UGC tutorial remake (EARLY, 2 days old) |\n| LEG-28 | 375 | 0.29 | Window-cleaning client pitch |\n| LEG-06 | 379 | 0.30 | Agency logo advice |\n| LEG-31 | 454 | 0.36 | \"Need a website? DM me\" |\n| LEG-58 | 466 | 0.36 | \"3 AI repos that make money\" (EARLY, 3 days old) |\n\n### What the winners did that the losers didn't\n- OBSERVATION: All five winners gave the viewer something to do or make themselves today (a video, a setup, a credential). Four of the bottom five asked the viewer to buy a service, adopt a mindset, or remember a repo name.\n- INTERPRETATION: The page's audience follows for usable AI skills.\n- HYPOTHESIS: covered by HYP-002 (framing) and the pillar plan.\n\n### Learnings created\nLRN-001 to LRN-012. Patterns created: WIN-01 to WIN-04, LOSE-01 to LOSE-04. Hypotheses opened: HYP-001 to HYP-006.\n\n### Brand flags\n- BRAND-FLAG-001: the highest-view posts (AI video/brainrot tutorials) attract AI-curious creators more than would-be builders. Reach and community fit pull in different directions. Decision for Dhruv: what share of weekly posts goes to the TREND SLOT vs build content (P4)? Suggested starting split: 2 trend posts, 5 build/setup/career posts per week.\n\n### CONTINUE\n1. \"Start here\" and career lists framed around an outcome (WIN-02, WIN-03): highest saves and shares.\n2. Result-first openings on visual content (WIN-01).\n3. Posting daily: consistency is already there.\n\n### STOP\n1. Client-work and \"DM me\" posts on this page (LOSE-02).\n2. Re-shooting past tutorial winners (LOSE-01).\n3. Standalone mindset/agency advice (LOSE-04).\n\n### TEST\n1. **EXP-002 (HYP-002):** next 4 list posts. 2 problem/outcome hooks, 2 feature hooks, pillar P2 or P4, 30 to 45 s. Win = problem pair >= 1.5x feature pair on (shares + saves)/views and D7 views.\n2. **EXP-003 (HYP-004):** launch one named series (6 posts over 2 weeks). Win = series median new followers per 1K views >= 1.5x the nearest 6 one-offs.\n3. **EXP-004 (HYP-005):** on the next major AI launch, post a utility script within 48 h. Win = >= 3x baseline.\n\n### Data request for next week\n- TikTok Studio screenshots for every post from the last 7 days: overview (views, avg watch time, watched full video %, new followers) and the retention graph.\n- Followers tab: gender, age, top countries, most active times.\n- Top 20 comments on LEG-13, LEG-17, LEG-25, LEG-32, LEG-34 (or approve a comment scrape, ~$0.30).","continue":["\"Start here\" and career lists framed around an outcome (WIN-02, WIN-03): highest saves and shares.","Result-first openings on visual content (WIN-01).","Posting daily: consistency is already there."],"date":"2026-09-11","id":"WK-2026-W37","stop":["Client-work and \"DM me\" posts on this page (LOSE-02).","Re-shooting past tutorial winners (LOSE-01).","Standalone mindset/agency advice (LOSE-04)."],"test":["**EXP-002 (HYP-002):** next 4 list posts. 2 problem/outcome hooks, 2 feature hooks, pillar P2 or P4, 30 to 45 s. Win = problem pair >= 1.5x feature pair on (shares + saves)/views and D7 views.","**EXP-003 (HYP-004):** launch one named series (6 posts over 2 weeks). Win = series median new followers per 1K views >= 1.5x the nearest 6 one-offs.","**EXP-004 (HYP-005):** on the next major AI launch, post a utility script within 48 h. Win = >= 3x baseline."],"title":"Seed report: last 60 legacy posts"}},"runs":{"RUN-2026-W37":{"body":"# RESEARCH LOG\n\nOwner: Agent 1. One entry per run, newest on top. Keeps a record of what was searched, what it cost and what changed, so later runs don't repeat work.\n\n---\n\n## RUN-2026-W37 | 2026-09-11 | Seed run (built with the system)\n\n**Queries (search, past month, 30 each):** claude code, claude cowork, ai agent tutorial, vibe coding app, build app with ai no code, n8n automation, ai tools you need, chatgpt tips, ai website builder, make money with ai\n**Baselines pulled:** 25 creators x 20 latest non-pinned posts (498 posts): yatesvids, deebuildsai, textura.us, bymarcoperez, cody.saunders.ai, millee.md, lucca.the.develop, webforge6, johnsavage.ai, shigcodes, verysuccessfulcompany, malikontech, bengusberg, carter.braydon, taki.gpt, ai.honeycove, itsmariahbrunner, willfrancis24, usefulaiwebsites, androoagi, techwlynn, techwithdonna, xo.cierranicole, dawoodzahidd, marcinteodoru\n**Subtitles pulled:** 14 niche outliers + 11 of Dhruv's own posts\n**Also pulled:** @ceotalks23 last 60 posts (feeds Agent 3's baseline)\n\n**Counts:** 300 search results, 249 unique creators, 70 raw outliers (OS >= 5, >= 20K views), 17 analysed, 4 excluded (BOOST?, OFF-NICHE, SPON)\n**Spend [ESTIMATE]:** own profile 60 x $0.0037 = $0.22 | search 300 x ($0.0037 + $0.0013 date filter) = $1.50 | baselines 498 x $0.0037 = $1.84 | detail pages 14 x $0.0037 = $0.05 | run-start fees ~$0.004 | **total ~$3.61**\n\n**Top findings**\n1. Three creators independently hit big with \"your AI-built site is unsafe / looks AI-made\" checklists (CP-01, 10 outliers). This is the strongest pattern in the run and sits right on Dhruv's community uns and 18 nightly syncs fired and wrote nothing between 11 and 29 Sep. This run only completed because pinned writes were retried one at a time and new docs were created unpinned. Fix is in each task's settings: turn on Automatically approve. The folder mirror and morning briefing tasks already have it, which is why they succeed.","secondBlocker":"Even with approvals fixed, Agent 2 has nothing to do nightly: no idea has been set to APPROVED since 11 Sep. 8 ideas sit at READY or RESEARCHED, ranks 1 to 10, and SCRIPT-006 and SCRIPT-008 are still DRAFT.","spendNote":"Apify clockworks/tiktok-scraper run 8ZBMPP4XwEIBKCwva, pay per event, free tier: actor start $0.001 + 10 results x $0.0037 = $0.037, plus sorting add-on up to 10 x $0.0013 = $0.013. Estimated total $0.05, inside the $0.25 nightly cap. The platform refused a $0.25 run cap (its minimum is $0.50), so the run carried the $0.50 backstop. Apify reported no actual charge figure.","spendUsd":0.05,"startedAt":"2026-09-29T21:44:00Z","status":"done","summary":"Nightly sync for 29 Sep, run 22:44 BST and finished 30 Sep 09:58 BST after the session resumed. No pending requests and no new notes, so nothing to handle. Pulled the latest 10 posts: 7 new (EXT-001 to EXT-007, 23 to 29 Sep, ungraded) and 3 pinned posts refreshed (LEG-17 483,300 views, LEG-01 5,386, LEG-02 5,061). Followers 2,617 on 30 Sep, up 653 from 1,964 on 11 Sep. Agent 2 drafted nothing: no APPROVED idea is missing a script, and SCRIPT-006 and SCRIPT-008 are still DRAFT waiting on Dhruv. FLAG for Monday: the database has no posts between 11 and 22 Sep because nightly syncs did not run in that window; the 30-post weekly pull should backfill them before Agent 3 regrades.","type":"nightly"}},"scripts":{"SCRIPT-006":{"body":"## SCRIPT-006 | from IDEA-006 | status: DRAFT\nVariant of: none | Test variable: HYP-004 (named series, post 1 of 6: \"AI agents run my TikTok\")\n\n### CONTENT STRATEGY\n- **Concept:** Show the three-agent content system and the real findings it produced about Dhruv's own account.\n- **Target viewer:** non-coders curious about AI agents; creators who want to grow\n- **Primary emotion:** curiosity, then \"I could build that\"\n- **Hook mechanism:** unexpected result + open loop (\"here's what they found\")\n- **Retention mechanism:** three agents counted off (progress), the most surprising finding held for Agent 3, series promise at the end\n- **Payoff:** \"317,300 to 1,608\": the same script re-made six weeks later got half a percent of the views\n- **CTA:** follow for Part 2\n- **Expected viewer action:** follow (series), comment\n- **Patterns applied:** CP-05 (aspirational build with a climax), WIN-01's result-first idea (numbers on screen early). **Avoided:** LOSE-04 (no mindset talk), LOSE-02 (no service pitch)\n- **Estimated length:** ~205 words / 4 = ~51 s\n\n### SCRIPT\n**[0-3 s] HOOK (spoken):** \"I built three AI agents that decide what I post on here. This is what they found in my last sixty videos.\"\n**[0-3 s] ON-SCREEN TEXT:** \"3 AI agents now run my TikTok (Part 1)\"\n\n**[3-12 s]** \"Agent one studies other creators. It pulled three hundred AI videos from the last month and flagged the ones that did twenty, fifty, even two hundred times better than that creator normally does.\"\n\n**[12-19 s]** \"Agent two turns what it finds into scripts. The video you're watching right now? Agent two wrote the first draft.\"\n\n**[19-37 s]** \"Agent three grades my own videos, and it didn't go easy. My posts offering website work got just over half my normal views. And my most viral video ever, three hundred and seventeen thousand views? I re-made it six weeks later with the same script. One thousand six hundred.\"\n\n**[37-45 s]** \"It's already told me what to stop, what to keep and what to test next. So for the next month, I'm posting what they tell me to.\"\n\n**[45-52 s]** \"I didn't write a single line of code. It's three instruction files, one shared folder and Claude doing the work. Follow for Part 2, where you see the first video they picked.\" [PLACEHOLDER: Dhruv decides if \"Part 2\" gets a day, e.g. \"on Friday\"]\n\n### VISUAL DIRECTION\n| Time | On screen | Framing | B-roll / screen rec | Text overlay | Edit note |\n|---|---|---|---|---|---|\n| 0-3 s | The content-system folder open, 3 agent files visible | Face cam top-right over screen | Folder view | \"3 AI agents now run my TikTok (Part 1)\" | Start mid-sentence, no breath |\n| 3-12 s | current-outliers.md scrolling, OS numbers highlighted | Screen rec | Outlier table | \"300 videos scanned\" then \"20x / 50x / 214x\" | Pop each number as it's said |\n| 12-19 s | script-bank.md with SCRIPT-006 visible | Screen rec, zoom to the title | | \"Agent 2 wrote this video\" | Pattern interrupt: quick zoom |\n| 19-37 s | performance-history.md, then side-by-side thumbnails of LEG-17 and LEG-57 | Screen rec | Own TikTok profile | \"0.59x\" then \"317,300 → 1,608\" | Hold the big number 1.5 s; the payoff |\n| 37-45 s | weekly-performance.md CONTINUE / STOP / TEST lists | Screen rec | | \"STOP / KEEP / TEST\" | Fast scroll |\n| 45-52 s | Face cam full screen | Talking head | | \"Part 2: the first video they chose\" | End on face |\n\n### ALTERNATIVE HOOKS\n1. \"My AI agents went through my last sixty TikToks and told me to stop doing three things.\"\n2. \"Three AI agents just told me my biggest mistake was re-making my most viral video.\"\n3. \"For the next month, three AI agents decide what I post. Part one.\"\n\n### CAPTION\nThree AI agents now pick what I post. Agent 3 graded my last 60 videos and found my most viral one was also my biggest mistake. Part 2 soon.\n#aiagents #claude #claudeai #aitools #buildwithai\n\n### CTA\nFollow for Part 2. Pin a comment that says what Part 2 will show, so the series promise is visible.\n\n### PRE-SHOOT CHECKS\n- [x] Numbers match the data: 300 search results (RUN-2026-W37), OS 21 / 50 / 214 (OUT-003, OUT-001, OUT-004), client-work 0.59x (LRN-003), 317,300 vs 1,608 (LRN-002)\n- [ ] Nothing client-identifying on screen (the Zyntell context file and client names must stay closed)\n- [ ] Part 2 planned: which idea goes next (suggest SCRIPT-008 or IDEA-001) [PLACEHOLDER]\n- [ ] No locked-brand conflicts","createdAt":"2026-09-11T16:00:00Z","createdBy":"Agent 2 (seed run)","hook":"I built three AI agents that decide what I post on here. This is what they found in my last sixty videos.","id":"SCRIPT-006","ideaId":"IDEA-006","lengthS":52,"status":"DRAFT","testVariable":"HYP-004 (series, post 1 of 6)","title":"I built 3 AI agents that decide what I post (Part 1)"},"SCRIPT-008":{"body":"## SCRIPT-008 | from IDEA-008 | status: DRAFT\nVariant of: none | Test variable: HYP-002, problem/outcome-framed hook (pair with a feature-framed list post for EXP-002)\n\n### CONTENT STRATEGY\n- **Concept:** Claude praises a weak idea by default. One line in its settings makes it push back. Show both replies.\n- **Target viewer:** Claude or ChatGPT beginner who uses AI to check ideas\n- **Primary emotion:** surprise, then relief\n- **Hook mechanism:** unexpected result + before/after (AI being wrong is the pratfall)\n- **Retention mechanism:** open loop (\"then I added one line\") closed at ~22 s; the second reply is the payoff\n- **Payoff:** the new, honest reply and the exact line on screen\n- **CTA:** screenshot the line + follow for the other day-one settings (sets up a mini-series)\n- **Expected viewer action:** save/screenshot, follow\n- **Patterns applied:** WIN-02 (a setup change people can copy in 10 s), HYP-002 (lead with the problem, not \"custom instructions\"). **Avoided:** LOSE-03 (no \"5 Claude settings you need\" feature list)\n- **Estimated length:** ~130 words / 4 = ~33 s, plus 2 s of silent screen = ~35 s\n\n### PRE-SHOOT TEST (do this first, the video depends on it)\n1. New chat on default settings (preferences empty). Prompt: \"Rate this business idea out of 10 and tell me if I should do it: a £30/month app that reminds people to drink water.\"\n2. If Claude already pushes back hard, try a subtler weak idea until the default reply is clearly too positive. Don't fake it. If no weak idea gets a flattering reply, drop this script and tell Agent 3 (that result is a learning too).\n3. Add the line to preferences, open a new chat, run the same prompt. Screen-record both.\n4. Replace the bracketed replies below with the real wording.\n\n### SCRIPT\n**[0-2 s] HOOK (spoken):** \"Claude told me my terrible business idea was brilliant.\"\n**[0-2 s] ON-SCREEN TEXT:** \"Claude rated this 8/10\" [replace with the real score]\n\n**[2-8 s]** \"I asked it to rate an app that charges thirty quid a month to remind you to drink water.\"\n\n**[8-13 s]** \"It said [real phrase from the default reply, e.g. 'strong potential in the wellness market']. It did not say 'please don't'.\"\n\n**[13-21 s]** \"So I opened settings and added one line to my preferences. Now every chat starts with this.\" (line appears on screen)\n\n**[21-29 s]** \"Same question, new chat. This time it gave me [real number] reasons it fails, and what I'd have to prove before spending a penny.\"\n\n**[29-35 s]** \"Screenshot the line. This is one of four settings I change on day one. Follow, and I'll show you the other three.\"\n\n**On-screen line (Dhruv's own instruction, tidy wording before shooting):**\n> Never agree with me by default. Your first instinct is to stress-test what I say and find the weakest point before you validate anything.\n\n### VISUAL DIRECTION\n| Time | On screen | Framing | B-roll / screen rec | Text overlay | Edit note |\n|---|---|---|---|---|---|\n| 0-2 s | Default reply with the score highlighted | Screen rec, zoomed on the score | Claude chat | \"Claude rated this 8/10\" | Hard zoom in on frame 1 |\n| 2-8 s | Prompt being typed | Face cam bottom corner, screen top | Claude chat | \"£30/month water reminder app\" | Speed-ramp the typing |\n| 8-13 s | Scroll through the praising reply | Screen rec | | Highlight 2 flattering phrases in yellow | Cut on each highlight |\n| 13-21 s | Settings > preferences box, line pasted | Screen rec | Claude settings [CHECK path on the live app: Settings > Profile > personal preferences] | The line, large, 2 lines max | Pattern interrupt: switch from chat to settings |\n| 21-29 s | New reply, pushback highlighted | Split screen: old reply left, new right | | \"Same question\" | Hold 1 s on the split so it reads |\n| 29-35 s | Face cam full screen | Talking head | | \"1 of 4 day-one settings\" | End on face, no outro card |\n\n### ALTERNATIVE HOOKS\n1. \"Ask Claude to rate your worst idea. If it scores it above five, change this setting.\"\n2. \"Same question to Claude, before and after I changed one setting.\"\n3. \"Your AI is flattering you. Here's the line that stops it.\"\n\n### CAPTION\nClaude rated my water-reminder app 8/10. One line in settings and it gave me the honest answer instead. Screenshot the line before you scroll.\n#claude #claudeai #aitips #chatgpt #learnai\n\n### CTA\nScreenshot + follow for the next three day-one settings. No keyword needed: the line is on screen.\n\n### PRE-SHOOT CHECKS\n- [ ] Default reply really is flattering (test above)\n- [ ] Settings path confirmed on the live app [CHECK]\n- [ ] Score and phrases in the script match the recording\n- [ ] Next three \"day-one settings\" exist, so the follow promise is real\n- [ ] No locked-brand conflicts\n\n---","createdAt":"2026-09-11T16:00:00Z","createdBy":"Agent 2 (seed run)","hook":"Claude told me my terrible business idea was brilliant.","id":"SCRIPT-008","ideaId":"IDEA-008","lengthS":35,"status":"DRAFT","testVariable":"HYP-002 (problem-framed arm)","title":"The line that stops Claude agreeing with everything"}},"winlose":{"LOSE-01":{"body":"### LOSE-01 | Re-shooting a past winner after its trend has cooled\n- **Pattern:** Re-making a tutorial that already went viral, with the same steps and structure, weeks later.\n- **Evidence:** LRN-002\n- **Posts:** LEG-57 (1,608 vs original LEG-17 317,300), LEG-59 (296 vs LEG-13 28,100), LEG-44 (3,213 vs LEG-25 55,400)\n- **Confidence:** MEDIUM\n- **Likely problem:** The audience had already seen the trend. Novelty was the driver, and the remake had none.\n- **What to change:** Find the next trend instead (Agent 1 trend check). If a topic must return, change the output (a new trend, a new tool, a new result), not only the wording.\n- **When it might still work:** Evergreen topics with a new angle (LRN-012: the certifications repeat still hit 3.4x). A genuinely updated method (\"the old way broke, here's the new one\").\n- **Last observed:** 2026-09-09 (LEG-59)","confidence":"MEDIUM","id":"LOSE-01","last":"2026-09-09","title":"Re-shooting a past winner after its trend has cooled","type":"LOSE"},"LOSE-02":{"body":"### LOSE-02 | Service pitches and client case posts with a DM CTA\n- **Pattern:** \"I built X for a local business, DM me if you need one.\"\n- **Evidence:** LRN-003\n- **Posts:** LEG-04, LEG-08, LEG-18, LEG-19, LEG-23, LEG-28, LEG-29, LEG-31, LEG-42, LEG-53 (median 755, 0.59x)\n- **Confidence:** MEDIUM\n- **Likely problem:** Wrong audience. Followers want to build with AI themselves.\n- **What to change:** Retired from this page (Dhruv's decision, 2026-09-11). Real builds can appear as teaching material (\"here's how I built this with Claude\"), never as a pitch.\n- **When it might still work:** On a separate business account aimed at local business owners.\n- **Last observed:** 2026-09-03 (LEG-53)","confidence":"MEDIUM","id":"LOSE-02","last":"2026-09-03","title":"Service pitches and client case posts with a DM CTA","type":"LOSE"},"LOSE-03":{"body":"### LOSE-03 | Leading with tool or item names instead of the problem or outcome\n- **Pattern:** Hooks like \"5 Claude design skills everyone should have\" or \"3 AI repos that make money\" that name the tools up front.\n- **Evidence:** LRN-005\n- **Posts:** LEG-52 (0.58x), LEG-58 (0.36x), LEG-49 (0.50x), each paired with a niche outlier that covered overlapping content with problem/outcome/identity framing\n- **Confidence:** LOW (confounded by account size and delivery)\n- **Likely problem:** A tool name means nothing to a beginner who hasn't hit the problem it solves.\n- **What to change:** Open on the visible problem (\"people can tell your site was made with AI\") or the outcome (\"13 minutes of footage cut to 2, by ChatGPT\"), then reveal the tools.\n- **When it might still work:** When the tool name itself is news (a launch everyone is searching for).\n- **Last observed:** 2026-09-08 (LEG-58)","confidence":"LOW","id":"LOSE-03","last":"2026-09-08","title":"Leading with tool or item names instead of the problem or outcome","type":"LOSE"},"LOSE-04":{"body":"### LOSE-04 | Generic mindset or agency advice with no AI demo\n- **Pattern:** Motivational or \"how to run an agency\" talking points with nothing on screen to learn.\n- **Evidence:** LRN-008\n- **Posts:** LEG-06 (0.30x), LEG-16 (0.39x), LEG-20 (0.39x), LEG-26 (0.58x), LEG-45 (0.83x)\n- **Confidence:** MEDIUM\n- **Likely problem:** No concrete AI value, which is the reason people follow the page.\n- **What to change:** Stop. If a mindset point matters, attach it to a real build (\"I built this in one evening; here's what stopped me doing it sooner\").\n- **When it might still work:** As a short personal story inside a build video, not as a standalone post.\n- **Last observed:** 2026-08-13 (LEG-45)","confidence":"MEDIUM","id":"LOSE-04","last":"2026-08-13","title":"Generic mindset or agency advice with no AI demo","type":"LOSE"},"WIN-01":{"body":"### WIN-01 | Fresh-trend AI creation tutorial, result shown first\n- **Pattern:** A step-by-step, free, under-10-minutes tutorial for making an AI video or image format that is trending right now, opening on the finished result before any speech.\n- **Evidence:** LRN-001, LRN-007\n- **Posts:** LEG-17 (317,300, 248x), LEG-25 (55,400, 43x), LEG-13 (28,100, 22x), LEG-40 (4,150, 3.2x), LEG-05 (3,810, 3.0x), LEG-22 (3,692, 2.9x)\n- **Confidence:** MEDIUM\n- **Why it may work:** Striking visual stops the scroll; \"for completely free\" and \"under 10 minutes\" lower the barrier (zero-price effect); the viewer can copy it the same day.\n- **How to apply:** Only for a trend under 14 days old with 3+ fresh outliers (Agent 1 TREND SLOT). Show the result in frame 1. Name the tools on screen.\n- **How NOT to overuse:** Never re-shoot a past tutorial for the same trend (LOSE-01). One trend tutorial per trend. Tutorials on AI video don't build the community topic by themselves, so balance them with P4 build content.\n- **Last validated:** 2026-08-10 (LEG-40). Most recent attempts (LEG-57, LEG-59) were remakes and failed.","confidence":"MEDIUM","id":"WIN-01","last":"2026-08-10","title":"Fresh-trend AI creation tutorial, result shown first","type":"WIN"},"WIN-02":{"body":"### WIN-02 | \"Start here\" setup list for a tool people are switching to\n- **Pattern:** Numbered list of the first things to do in Claude (or another tool gaining users), framed for beginners, with a \"get ahead of most people\" payoff.\n- **Evidence:** LRN-004\n- **Posts:** LEG-34 (24,000, 18.8x, save rate 4.9%), LEG-30 (5,913, 4.6x, save 6.2%), LEG-35 (4,470, 3.5x), LEG-39 (1,935, 1.5x), LEG-47 (1,868, 1.5x), LEG-12 (1,647, 1.3x). Counter-example: LEG-52 (743, 0.58x), LEG-54 (1,531, 1.2x).\n- **Confidence:** MEDIUM\n- **Why it may work:** LEG-34 tied itself to a real migration (\"a lot of people are moving from ChatGPT to Claude\"), so it met people at a decision point. Lists are save-worthy.\n- **How to apply:** Anchor to a live moment (a switch, a launch, a new feature). Each item needs a concrete visible action (a toggle, a menu). End on the strongest item.\n- **How NOT to overuse:** Diminishing returns show already: five Claude lists in August, only one breakout. Change the angle (problem-first, see HYP-002) rather than producing another \"5 Claude skills\".\n- **Last validated:** 2026-08-08 (LEG-34)","confidence":"MEDIUM","id":"WIN-02","last":"2026-08-08","title":"\"Start here\" setup list for a tool people are switching to","type":"WIN"},"WIN-03":{"body":"### WIN-03 | Career-value list (\"gets you hired\")\n- **Pattern:** A short list of AI credentials or skills tied to getting a job.\n- **Evidence:** LRN-004, LRN-012\n- **Posts:** LEG-32 (16,400, 12.8x, share rate 1.98%), LEG-41 (4,332, 3.4x, share 1.82%)\n- **Confidence:** LOW (2 posts)\n- **Why it may work:** Job anxiety is broad and constant. People forward these to friends (the highest share rate on the account).\n- **How to apply:** Outcome framing (\"get you hired\", \"employers list this\"). Every claim must be accurate and checkable (cert names, cost, time).\n- **How NOT to overuse:** Plain \"free courses\" posts without the career frame averaged 0.65x (LEG-10, LEG-14, LEG-56).\n- **Last validated:** 2026-08-11","confidence":"LOW","id":"WIN-03","last":"2026-08-11","title":"Career-value list (\"gets you hired\")","type":"WIN"},"WIN-04":{"body":"### WIN-04 | \"Best AI for each task\" comparison\n- **Pattern:** A quick map of which AI tool to use for which job.\n- **Posts:** LEG-33 (3,266, 2.6x), LEG-48 (3,609, 2.8x)\n- **Confidence:** LOW\n- **Why it may work:** Answers a question beginners ask constantly. Easy to save.\n- **How to apply:** Refresh after big launches (the answer changes).\n- **How NOT to overuse:** Once a month at most.\n- **Last validated:** 2026-08-15","confidence":"LOW","id":"WIN-04","last":"2026-08-15","title":"\"Best AI for each task\" comparison","type":"WIN"}},"requests":{}};

  ["overview","Overview"],["agents","Agents"],["ideas","Ideas"],["scripts","Scripts"],["research","Research"],

  if (s < 60) return "just now"; if (s < 3600) return Math.floor(s/60)+" min ago";
  if (s < 86400) return Math.floor(s/3600)+" h ago"; return Math.floor(s/86400)+" d ago";
}
const ukTime = (d, opts) => d.toLocaleString("en-GB", Object.assign({timeZone:"Europe/London"}, opts || {weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"}));
const hhmm = iso => iso ? new Date(iso).toLocaleTimeString("en-GB",{timeZone:"Europe/London",hour:"2-digit",minute:"2-digit"}) : "";
const LP = new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/London",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23",weekday:"short"});
function lparts(d){ const o={}; LP.formatToParts(d).forEach(p=>o[p.type]=p.value); return o; }
function nextLondon(dow, h, m){ // dow: 0-6 (Sun=0) or null for daily; h:m is UK wall-clock time
  const now = new Date(), W = {Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
  for (let i=0;i<9;i++){
    const p = lparts(new Date(now.getTime()+i*86400000));
    const guess = Date.UTC(+p.year, +p.month-1, +p.day, h, m);
    const q = lparts(new Date(guess)); const off = Date.UTC(+q.year,+q.month-1,+q.day,+q.hour,+q.minute) - guess;
    const t = new Date(guess - off);
    if ((dow==null || W[p.weekday]===dow) && t > now) return t;
  }
  return now;
}

// ---------- markdown (escape first, then format) ----------
function inline(t){
  t = esc(t);
  t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
  t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  t = t.replace(/(^|[\s(|])(https?:\/\/[^\s<)|]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  return t;
}
function md(src){
  const L = String(src||"").replace(/\r/g,"").split("\n"); let h = "", i = 0;
  while (i < L.length){
    let l = L[i];
    if (/^```/.test(l)){ let b=[]; i++; while(i<L.length && !/^```/.test(L[i])) b.push(L[i++]); i++; h+=`<pre><code>${esc(b.join("\n"))}</code></pre>`; continue; }
    if (/^\s*\|/.test(l)){ let rows=[]; while(i<L.length && /^\s*\|/.test(L[i])) rows.push(L[i++]);
      const cells = r => r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      let out="<table>"; let hdr=true;
      rows.forEach((r,ix)=>{ if(/^\s*\|[\s\-:|]+\|\s*$/.test(r)) return; const tag = (ix===0 && rows[1] && /^\s*\|[\s\-:|]+\|\s*$/.test(rows[1]))?"th":"td"; out+="<tr>"+cells(r).map(c=>`<${tag}>${inline(c)}</${tag}>`).join("")+"</tr>"; });
      h+=out+"</table>"; continue; }
    const hm = l.match(/^(#{1,4})\s+(.*)$/); if (hm){ const n=hm[1].length; h+=`<h${n}>${inline(hm[2])}</h${n}>`; i++; continue; }
    if (/^>\s?/.test(l)){ let b=[]; while(i<L.length && /^>\s?/.test(L[i])) b.push(L[i++].replace(/^>\s?/,"")); h+=`<blockquote>${inline(b.join(" "))}</blockquote>`; continue; }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)){ const ord=/^\s*\d+\./.test(l); let items=[];
      while(i<L.length && (/^\s*([-*]|\d+\.)\s+/.test(L[i]) || (/^\s{2,}\S/.test(L[i]) && items.length))){
        if (/^\s*([-*]|\d+\.)\s+/.test(L[i])) items.push(L[i].replace(/^\s*([-*]|\d+\.)\s+/,"")); else items[items.length-1]+=" "+L[i].trim(); i++; }
      h+=`<${ord?"ol":"ul"}>`+items.map(x=>`<li>${inline(x).replace(/^\[ \]/,"☐").replace(/^\[x\]/i,"☑")}</li>`).join("")+`</${ord?"ol":"ul"}>`; continue; }
    if (/^---+\s*$/.test(l)){ h+="<hr>"; i++; continue; }
    if (!l.trim()){ i++; continue; }
    let p=[]; while(i<L.length && L[i].trim() && !/^(#{1,4}\s|```|\s*\||>|\s*([-*]|\d+\.)\s|---+\s*$)/.test(L[i])) p.push(L[i++]);
    h+=`<p>${inline(p.join(" "))}</p>`;
  }
  return h;
}

function chartSVG(posts){
  if (!posts.length) return '<div class="empty"><b>No posts yet</b></div>';
  const W=900,H=280,l=52,r=14,t=14,b=34, iw=W-l-r, ih=H-t-b;
  const lo=Math.log10(100), hi=Math.log10(Math.max(1e6, ...posts.map(p=>p.views||1)));
  const y = v => t + ih - (Math.log10(Math.max(100,v))-lo)/(hi-lo)*ih;
  const bw = iw/posts.length, base = baseline();
  let g = "";
  for (let e=2;e<=Math.floor(hi);e++){ const yy=y(10**e); g+=`<line class="grid" x1="${l}" x2="${W-r}" y1="${yy}" y2="${yy}"/><text x="${l-8}" y="${yy+4}" text-anchor="end">${kfmt(10**e)}</text>`; }
  let bars="", hits="", months="", lastM="";
  posts.forEach((p,i)=>{ const x=l+i*bw, yy=y(p.views||0), cls=(p.views||0)>=base?"hi":"lo";
    bars+=`<rect class="${cls}" x="${(x+bw*.14).toFixed(1)}" y="${yy.toFixed(1)}" width="${(bw*.72).toFixed(1)}" height="${(t+ih-yy).toFixed(1)}" rx="1.5" data-i="${i}"/>`;
    hits+=`<rect class="hit" x="${x.toFixed(1)}" y="${t}" width="${bw.toFixed(1)}" height="${ih}" data-i="${i}" tabindex="0" aria-label="${esc(p.id)}: ${fmt(p.views)} views"/>`;
    const m = String(p.date).slice(0,7); if (m!==lastM){ lastM=m; months+=`<text x="${x.toFixed(1)}" y="${H-12}">${new Date(p.date+"T12:00:00Z").toLocaleDateString("en-GB",{month:"short"})}</text><line class="grid" x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${t+ih}" y2="${t+ih+5}"/>`; }
  });
  const top = [...posts].sort((a,b)=>b.views-a.views).slice(0,3);
  const labels = top.map(p=>{ const i=posts.indexOf(p); const x=l+i*bw+bw/2; const yy=y(p.views)-6; return `<text x="${x.toFixed(1)}" y="${Math.max(12,yy).toFixed(1)}" text-anchor="middle" style="fill:var(--ink);font-weight:700">${kfmt(p.views)}</text>`; }).join("");
  const by=y(base);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Views per post on a log scale, ${posts.length} posts, baseline ${fmt(base)}">${g}${bars}<line class="base" x1="${l}" x2="${W-r}" y1="${by}" y2="${by}"/><text x="${W-r}" y="${by-5}" text-anchor="end" style="fill:var(--red)">baseline ${fmt(base)}</text>${labels}${months}${hits}</svg>`;
}
function bindChart(){
  const c=$("#chart"); if(!c) return; const posts=[...S.posts].sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  const show = i => { const p=posts[i]; if(!p) return; c.querySelectorAll("rect.sel").forEach(r=>r.classList.remove("sel")); const bar=c.querySelector(`rect[data-i="${i}"]:not(.hit)`); bar && bar.classList.add("sel");
    $("#tip").innerHTML = `<strong>${esc(p.id)}</strong> · ${esc(p.date)} · ${fmt(p.views)} views (${p.xBase??"–"}× base) · ${esc(p.pillar||"")} — ${esc((p.caption||"").slice(0,90))}`; };
  c.addEventListener("mouseover", e=>{ const i=e.target.dataset?.i; if(i!=null) show(+i); });
  c.addEventListener("focusin", e=>{ const i=e.target.dataset?.i; if(i!=null) show(+i); });
  c.addEventListener("click", e=>{ const i=e.target.dataset?.i; if(i!=null){ show(+i); } });
}
