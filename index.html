    acts = `<button class="btn primary" data-act="saveLog">Save day-7 numbers</button><button class="btn" data-act="close">Cancel</button>`;
  } else if (d.kind==="posted"){
    head = `<span class="id">${esc(d.id)}</span><h3>Mark as posted</h3>`;
    body = `<div class="form"><label class="full" for="pUrl">TikTok URL<input id="pUrl" placeholder="https://www.tiktok.com/@ceotalks23/video/..."></label><label for="pDate">Date posted<input id="pDate" type="date" value="${new Date().toISOString().slice(0,10)}"></label>
      <label for="pFirst">First spoken word at (s)<input id="pFirst" inputmode="decimal" placeholder="0.2"></label><label for="pCta">CTA and position<input id="pCta" placeholder="follow@end"></label><label for="pSeries">Series / part<input id="pSeries" placeholder="AGENTS-1"></label></div>
      <p class="hint">Creates ${esc(d.id.replace("SCRIPT","POST"))} so Agent 3 can grade it on day 7.</p>`;
    acts = `<button class="btn primary" data-act="savePosted" data-id="${esc(d.id)}">Save</button><button class="btn" data-act="close">Cancel</button>`;
  }
  $("#drawerRoot").innerHTML = `<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="Details">
    <div class="drawer-h"><div>${head}</div><button class="x" data-act="close" aria-label="Close">×</button></div>
    <div class="drawer-b">${body}</div>${acts?`<div class="drawer-a">${acts}</div>`:""}</aside>`;
  const shot = $("#lgShot"); if (shot) shot.addEventListener("change", readShot);
}

// ---------- writes ----------
async function logAgent(id, patch, msg){
  const a = S.agents[id]; if (!a) return;
  const log = [...(a.log||[])]; if (msg) log.push({t:nowISO(), msg}); while (log.length>60) log.shift();
  try { await db.doc("agents/"+id).update(Object.assign({updatedAt:nowISO(), log}, patch)); } catch(e){ console.warn(e); }
}
async function addRequest(type, target, payload){
  return db.collection("requests").add({type, target, payload: payload||{}, status:"pending", createdAt: nowISO(), source:"dashboard"});
}
async function act(e){
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (a==="close"){ closeDrawer(); return; }
  if (a==="open"){ openDrawer({col:el.dataset.col, id}); return; }
  if (a==="ideaFilter"){ UI.ideaFilter = el.dataset.v; renderView(); return; }
  if (a==="ideaSort"){ UI.ideaSort = el.dataset.v; renderView(); return; }
  if (a==="research"){ UI.research = el.dataset.v; renderView(); return; }
  if (a==="outSort"||a==="perfSort"){ const st = a==="outSort"?UI.outSort:UI.perfSort; const k=el.dataset.k; st.d = st.k===k ? -st.d : -1; st.k=k; renderView(); return; }
  if (a==="selScript"){ UI.scriptSel = id; renderView(); return; }
  if (a==="gotoScript"){ UI.scriptSel = id; closeDrawer(); location.hash="#scripts"; renderView(); return; }
  if (a==="log-open"){ openDrawer({kind:"log"}); return; }
  if (a==="posted-open"){ openDrawer({kind:"posted", id}); return; }
  if (a==="stop"){ UI.abort?.abort(); return; }
  if (a==="cancelEdit"){ UI.drawer.edit=false; renderDrawer(); return; }
  if (a==="editDoc"){ UI.drawer.edit=true; renderDrawer(); return; }
  if (!db){ toast("The database isn't reachable from this view."); return; }
  try {
    if (a==="approve"){
      await db.doc("ideas/"+id).update({status:"APPROVED", approvedAt: nowISO()});
      await addRequest("approve_idea", id);
      toast(`${id} approved. Agent 2 scripts it tonight, or hit "Script now".`);
    } else if (a==="reject"){
      const reason = ($("#rejReason")?.value||"").trim(); if (!reason){ toast("Add a short reason first. The agents learn from it."); $("#rejReason")?.focus(); return; }
      await db.doc("ideas/"+id).update({status:"REJECTED", rejectedReason: reason, rejectedBy:"Dhruv (dashboard)"});
      await addRequest("reject_idea", id, {reason}); closeDrawer(); toast(`${id} rejected.`);
    } else if (a==="scriptStatus"){
      await db.doc("scripts/"+id).update({status: el.dataset.v, [el.dataset.v.toLowerCase()+"At"]: nowISO()});
      toast(`${id} marked ${el.dataset.v.toLowerCase()}.`);
    } else if (a==="savePosted"){
      const url = $("#pUrl").value.trim(); if (!/^https:\/\/(www\.|vm\.)?tiktok\.com\//.test(url)){ toast("Paste the TikTok link for the post."); $("#pUrl").focus(); return; }
      const s = byId("scripts", id), pid = id.replace("SCRIPT","POST"), date = $("#pDate").value;
      await db.doc("posts/"+pid).set({id:pid, kind:"POST", date, url, scriptId:id, ideaId:s?.ideaId||null, pillar: byId("ideas",s?.ideaId)?.pillar||null, caption:s?.title||"",
        firstWordS: parseFloat($("#pFirst").value)||null, ctaPos: $("#pCta").value.trim()||null, series: $("#pSeries").value.trim()||null, hookType:null, loggedAt: nowISO()});
      await db.doc("scripts/"+id).update({status:"POSTED", postId: pid, postedAt: nowISO()});
      if (s?.ideaId) await db.doc("ideas/"+s.ideaId).update({status:"PUBLISHED"}).catch(()=>{});
      await addRequest("mark_posted", pid, {url, date, scriptId:id});
      closeDrawer(); toast(`${pid} logged. Agent 3 grades it on day 7.`);
    } else if (a==="saveLog"){
      const pid = $("#lgPost").value, e2 = {id:pid, loggedAt: nowISO()};
      document.querySelectorAll("[id^=lg_]").forEach(i=>{ const v=i.value.trim().replace(/,/g,""); if (v!=="" && !isNaN(+v)) e2[i.dataset.k]=+v; });
      if (Object.keys(e2).length<3){ toast("Enter at least one number."); return; }
      await db.doc("perf_entries/"+pid).set(e2);
      const d7 = {}; ["views","avgPctWatched","watchedFullPct","retention3s","newFollowers","profileViews"].forEach(k=>{ if (e2[k]!=null) d7[k]=e2[k]; });
      await db.doc("posts/"+pid).update({d7}).catch(()=>{});
      closeDrawer(); toast(`Day-7 numbers saved for ${pid}.`);
    } else if (a==="note"){
      const t = $("#noteText").value.trim(); if (!t){ $("#noteText").focus(); return; }
      await addRequest("note", "", {text:t}); $("#noteText").value=""; toast("Sent. Tonight's sync picks it up.");
    } else if (a==="saveDoc"){
      await db.doc("docs/"+id).update({body: $("#docEdit").value, updatedAt: nowISO(), editedBy:"Dhruv (dashboard)"});
      UI.drawer.edit=false; renderDrawer(); toast("Saved.");
    } else if (a==="copy"){
      const s = byId("scripts", id); await navigator.clipboard.writeText(s.body); toast("Script copied.");
    } else if (a==="export"){
      const dl = await claude.use("downloads"); const blob = JSON.stringify(Object.fromEntries(Object.entries(S)),null,2);
      if (!dl){ toast("Downloads aren't available in this view."); return; }
      await dl.save({filename:"ceotalks23-control-room-"+new Date().toISOString().slice(0,10)+".json", data: blob}).catch(()=>{});
    } else if (a==="scriptNow"){ await scriptNow(id); }
    else if (a==="hooklab"){ await hookLab(id); }
  } catch(err){ console.error(err); toast(err?.code==="quota_exceeded" ? "The dashboard database is full. Archive old items first." : "That didn't save: "+(err?.message||err?.code||"unknown error")); }
}

// ---------- live Claude (sample) ----------
function ctxForScript(idea){
  const doc = id => byId("docs", id)?.body || "";
  const wl = S.winlose.map(w=>w.body).join("\n\n");
  const outs = S.outliers.filter(o => (idea.body||"").includes(o.id) || (idea.body||"").includes(o.creator||"@@")).map(o=>o.body).join("\n\n").slice(0,9000);
  const recent = S.scripts.slice(-3).map(s=>s.hook).filter(Boolean).join(" | ");
  const nextNum = "SCRIPT-" + idea.id.slice(5);
  return [
`You are Agent 2 (script writer) in Dhruv's @ceotalks23 TikTok content system. Write ONE complete script package for ${idea.id}, saved as ${nextNum}.`,
`FOLLOW THESE INSTRUCTIONS EXACTLY:\n${doc("agent-2").slice(0,9000)}`,
`BRAND AND CONTEXT (the locked block in section 14 always wins):\n${doc("context").slice(0,12000)}`,
`WINNING AND LOSING PATTERNS ON THIS ACCOUNT:\n${wl.slice(0,12000)}`,
`THE IDEA:\n${idea.body}`,
outs ? `LINKED OUTLIERS (mechanism reference only, never copy wording):\n${outs}` : "",
recent ? `HOOKS USED IN RECENT SCRIPTS (don't repeat these openings): ${recent}` : "",
`OUTPUT: Markdown only, starting with the line "## ${nextNum} | from ${idea.id} | status: DRAFT". Use the sections in this order: CONTENT STRATEGY, SCRIPT (timestamped, spoken hook + on-screen text), VISUAL DIRECTION (table), ALTERNATIVE HOOKS (3), CAPTION (max 5 hashtags), CTA, PRE-SHOOT CHECKS. Mark every tool name, menu path, price or model name you can't be sure is current with [CHECK]. Mark anything Dhruv must supply with [PLACEHOLDER: ...]. Never invent results or numbers. No em dashes. No "it's not X, it's Y" constructions. British spelling.`
  ].filter(Boolean).join("\n\n---\n\n");
}
async function scriptNow(ideaId){
  if (!sample){ toast("Live writing isn't available in this view."); return; }
  const idea = byId("ideas", ideaId); const sid = "SCRIPT-" + ideaId.slice(5);
  if (byId("scripts", sid)){ toast(`${sid} already exists.`); return; }
  UI.streaming = true; UI.abort = new AbortController();
  openDrawer({kind:"stream", title:`Writing ${sid} from ${ideaId}`, text:"", state:"Thinking… (the first words usually take 10 to 60 seconds)"});
  await logAgent("agent2", {status:"running", step:`Writing ${sid} (started from the dashboard)`, progress:0.1, runId:"DASH-"+new Date().toISOString().slice(0,10)}, `Started ${sid} from ${ideaId} (dashboard request)`);
  let lastPush = 0;
  try {
    const {text, truncated} = await sample(ctxForScript(idea), { signal: UI.abort.signal, cache:false, modelTier:"default",
      onText: ({text}) => { UI.drawer.text = text; const o=$("#streamOut"); if (o){ o.textContent = text; o.scrollTop = o.scrollHeight; } const st=$("#streamState"); if(st) st.textContent="Writing…";
        const p = Math.min(0.9, 0.15 + text.length/5000); if (Date.now()-lastPush>8000){ lastPush=Date.now(); logAgent("agent2",{progress:p, step:`Writing ${sid}: ${text.length.toLocaleString()} characters so far`}); } } });
    const hook = (text.match(/HOOK \(spoken\):\**\s*"?([^"\n]+)/)||[])[1] || null;
    const len = (text.match(/Estimated length:[^\n]*?(\d+)\s*s/i)||[])[1];
    await db.doc("scripts/"+sid).set({id:sid, ideaId, title: idea.title, status:"DRAFT", hook, lengthS: len?+len:null, testVariable: null, createdAt: nowISO(), createdBy:"Agent 2 (dashboard, live)", body:text, truncated:!!truncated});
    await db.doc("ideas/"+ideaId).update({status:"SCRIPTED", scriptId:sid});
    await logAgent("agent2", {status:"idle", step:"Done", progress:1, lastRunAt: nowISO(), lastRunSummary:`Drafted ${sid} from ${ideaId} on request.`}, `Drafted ${sid} (${text.length.toLocaleString()} characters)${truncated?", cut short":""}`);
    UI.streaming=false; UI.drawer.state = truncated ? "Saved, but the answer was cut short. Check the end of the script." : `Saved as ${sid} (draft).`; UI.drawer.scriptId = sid; renderDrawer();
  } catch(e){
    UI.streaming=false;
    const msg = e.code==="cancelled" ? "Stopped. Nothing saved." : e.code==="not_granted" ? "Claude access was declined for this page." : e.code==="rate_limited" ? "Too many requests right now. Try again in a minute." : "Writing failed: "+(e.message||e.code);
    await logAgent("agent2", {status:"idle", step:"Waiting for approved ideas", progress:0}, `${sid}: ${msg}`);
    UI.drawer.state = msg; UI.drawer.text = e.text || UI.drawer.text; renderDrawer();
  }
}
async function hookLab(sid){
  if (!sample){ toast("Live writing isn't available in this view."); return; }
  const s = byId("scripts", sid); const idea = byId("ideas", s.ideaId);
  toast("Hook lab running…");
  await logAgent("agent2", {status:"running", step:`Hook lab for ${sid}`, progress:0.3}, `Hook lab started for ${sid}`);
  try {
    const hooks = await sample.json(
`You write TikTok hooks for @ceotalks23 (AI for people who can't code; education-first, no hype, plain British English, no em dashes, no "it's not X, it's Y").
Write 10 hooks for this script, score each 1 to 5 on curiosity, specificity, tension, relevance, novelty, believability and instant clarity, and return ONLY the best 5 as a JSON array of {"hook": string (spoken, under 20 words), "onScreen": string (under 8 words), "why": string (under 15 words)}.
Frame around the viewer's problem or the visible outcome, never around tool names. Don't reuse the current hook.
CURRENT HOOK: ${s.hook||""}
IDEA: ${(idea?.body||"").slice(0,3000)}
SCRIPT: ${(s.body||"").slice(0,6000)}`, {modelTier:"default", cache:false});
    const arr = Array.isArray(hooks) ? hooks.filter(h=>h && h.hook).slice(0,5) : [];
    await db.doc("scripts/"+sid).update({hookLab: arr, hookLabAt: nowISO()});
    await logAgent("agent2", {status:"idle", step:"Done", progress:1}, `Hook lab for ${sid}: ${arr.length} options saved`);
    toast("5 new hooks added to the script.");
  } catch(e){
    await logAgent("agent2", {status:"idle", step:"Waiting for approved ideas", progress:0}, `Hook lab for ${sid} failed (${e.code})`);
    toast(e.code==="not_granted" ? "Claude access was declined for this page." : "Hook lab failed: "+(e.message||e.code));
  }
}
async function readShot(ev){
  const files = ev.target.files; if (!files?.length || !sample) return;
  const st = $("#shotState"); st.textContent = "Reading the screenshot…";
  try {
    const r = await sample.json(`These are TikTok Studio analytics screenshots for one video. Return ONLY a JSON object with these keys, using numbers exactly as shown, or null when a value isn't visible: {"views","avgWatchTimeS","avgPctWatched","watchedFullPct","retention3s","newFollowers","profileViews","likes","comments","shares","saves","forYouPct"}. Convert "1.2K" to 1200. Percentages as plain numbers (45.3). Never estimate.`, {images: files, modelTier:"default"});
    let n=0; Object.entries(r||{}).forEach(([k,v])=>{ const i=$("#lg_"+k); if (i && v!=null && !isNaN(+v)){ i.value=v; n++; } });
    st.textContent = n ? `Filled ${n} fields. Check them against the screenshot, then save.` : "Couldn't read any numbers. Type them in instead.";
  } catch(e){ st.textContent = e.code==="not_granted" ? "Claude access was declined for this page." : "Couldn't read that image: "+(e.message||e.code); }
}

// ---------- boot ----------
function route(){ const r = (location.hash||"#overview").slice(1); UI.route = SECTIONS.some(s=>s[0]===r) ? r : "overview"; schedule("nav"); schedule("view"); window.scrollTo({top:0}); }
window.addEventListener("hashchange", route);
document.addEventListener("click", act);
document.addEventListener("keydown", e=>{ if (e.key==="Escape" && UI.drawer) closeDrawer(); if ((e.key==="Enter"||e.key===" ") && e.target.matches("tr[data-act]")) { e.preventDefault(); act(e); } });
setInterval(()=>{ schedule("nav"); schedule("agents"); renderSync(); }, 30000);
route(); schedule("all");

(async () => {
  db = await claude.use("db");
  if (!db){ schedule("all"); return; }
  let got = new Set();
  const mark = k => { got.add(k); if (!loaded && got.size >= COLS.length + 2){ loaded = true; schedule("all"); } };
  db.doc("meta/system").onSnapshot(s => { S.meta = s.exists ? s.data() : null; mark("meta"); schedule("goal"); schedule("view"); }, e=>console.warn(e));
  db.collection("agents").onSnapshot(q => { S.agents = {}; q.docs.forEach(d=>S.agents[d.id]=d.data()); mark("agents"); schedule("agents"); schedule("nav"); if (UI.route==="agents") schedule("view"); }, e=>console.warn(e));
  COLS.forEach(c => db.collection(c).limit(1000).onSnapshot(q => { S[c] = q.docs.map(d=>Object.assign({id:d.id}, d.data())); mark(c); schedule("view"); schedule("nav"); schedule("drawer"); }, e=>console.warn(c, e)));
  setTimeout(()=>{ if(!loaded){ loaded = true; schedule("all"); } }, 8000);
})();
(async () => {
  sample = await claude.use("sample");
  if (sample){ try { const lim = await sample.limits(); sampleImages = !!lim?.images; } catch(e){} }
  schedule("view"); if (UI.drawer) refreshDrawer();
})();
})();
</script>
